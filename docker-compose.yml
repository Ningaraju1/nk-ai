services:
  backend:
  
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: nk-ai-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    working_dir: /app

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env.example

    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: nk-ai-celery

    command: celery -A config worker --loglevel=info

    volumes:
      - ./backend:/app

    working_dir: /app

    env_file:
      - .env.example

    depends_on:
      - postgres
      - redis

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: nk-ai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: nk_ai
      POSTGRES_USER: nk_ai
      POSTGRES_PASSWORD: nk_ai_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer

    container_name: nk-ai-adminer

    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  redis:
    image: redis:7-alpine

    container_name: nk-ai-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: nk-ai-opensearch

    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "9200:9200"
      - "9600:9600"

    volumes:
      - opensearch_data:/usr/share/opensearch/data

    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1

    container_name: nk-ai-opensearch-dashboards

    ports:
      - "5601:5601"

    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

    depends_on:
      - opensearch

    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nk-ai-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  qdrant_data:
