services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: nk-ai-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    working_dir: /app

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env.example

    restart: unless-stopped