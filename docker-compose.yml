services:
  backend:
  
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: nk-ai-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    working_dir: /app

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env.example

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: nk-ai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: nk_ai
      POSTGRES_USER: nk_ai
      POSTGRES_PASSWORD: nk_ai_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer

    container_name: nk-ai-adminer

    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  redis:
    image: redis:7-alpine

    container_name: nk-ai-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
